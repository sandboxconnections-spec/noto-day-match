<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Noto Day Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#F5F7F5;
  --surface:#FFFFFF;
  --ink:#1B1F22;
  --ink-2:#465055;
  --ink-3:#768287;
  --line:#D9DFDC;
  --bay:#1F5C63;
  --bay-soft:#E2EEEE;
  --urushi:#A8322D;
  --urushi-soft:#F5E3E1;
  --slate:#5E6A70;
  --slate-soft:#E8ECED;
  --kin:#8F6B1F;
  --shadow:0 1px 2px rgba(27,31,34,.06),0 10px 28px rgba(27,31,34,.09);
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --paper:#111416;--surface:#1A1F22;--ink:#EDF1EF;--ink-2:#B7C0C3;--ink-3:#89949A;--line:#2D3437;
    --bay:#62B3BA;--bay-soft:#16302F;--urushi:#E27A73;--urushi-soft:#3A1E1C;--slate:#A2AEB3;--slate-soft:#252B2E;--kin:#D8B062;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4);
  }
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{max-width:440px;margin-inline:auto;min-height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
.screen{display:flex;flex-direction:column;gap:16px;flex:1}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0}
.h-display{font-family:var(--display);font-weight:700;font-size:clamp(30px,8.4vw,38px);line-height:1.14;margin:0;text-wrap:balance}
.h2{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.25;margin:0;text-wrap:balance}
.lead{font-size:17px;color:var(--ink-2);margin:0;max-width:34ch}
.sub{font-size:14px;color:var(--ink-2);margin:0}
.note{font-size:13px;color:var(--ink-3);margin:0}
.spacer{flex:1}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:16px;padding:13px 18px;border-radius:12px;cursor:pointer;min-height:50px;width:100%}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.small{width:auto;min-height:40px;padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.linkbtn{appearance:none;background:none;border:0;color:var(--ink-2);font:inherit;font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px;align-self:center}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--bay);outline-offset:2px}

.deck{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.deck span{aspect-ratio:3/4;border-radius:7px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:clamp(15px,4.6vw,21px)}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0;padding:0;list-style:none;font-size:13px;color:var(--ink-2)}
.facts li::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ink-3);margin-right:7px;vertical-align:middle}

.q{display:flex;flex-direction:column;gap:10px}
.q-label{font-weight:700;font-size:15px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;padding:8px 14px;border-radius:999px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.good[aria-pressed="true"]{background:var(--bay);border-color:var(--bay);color:#fff}
.chip.bad[aria-pressed="true"]{background:var(--slate);border-color:var(--slate);color:#fff}
.chip:disabled{opacity:.35;cursor:not-allowed}
.chip .mk{font-weight:700;margin-right:6px}

.top{display:flex;align-items:center;gap:12px}
.progress{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s}
.count{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.stage{position:relative;display:grid;place-items:center;overflow:visible}

.card{position:relative;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;will-change:transform}
.card.fly{transition:transform .26s ease-in,opacity .26s ease-in}
.card.enter{animation:enter .22s ease-out}
@keyframes enter{from{transform:translateY(8px)}to{transform:none}}
.card-hero{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:var(--paper);border-bottom:1px solid var(--line)}
.card-photo{position:relative;height:170px;background:var(--line)}
.card-photo img{display:block;width:100%;height:100%;object-fit:cover}
.card-photo .drive{position:absolute;right:10px;bottom:10px;background:rgba(17,20,22,.72);color:#fff;border-radius:10px;padding:6px 10px}
.card-photo .drive .drive-a,.card-photo .drive .drive-l{color:#E3E8E6}
.card-photo .kchip{position:absolute;left:10px;top:10px;background:rgba(17,20,22,.72);color:#fff;border-radius:8px;padding:4px 8px;font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.card-photo .credit{position:absolute;left:10px;bottom:8px;max-width:52%;font-size:10px;line-height:1.3;color:#fff;background:rgba(17,20,22,.6);border-radius:4px;padding:2px 5px;text-decoration:none}
.kanji{font-family:var(--display);font-weight:800;font-size:60px;line-height:1}
.drive{display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:1px}
.drive-a{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.drive-n{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums}
.drive-l{font-size:12px;color:var(--ink-2)}
.card-body{padding:14px 18px 16px;display:flex;flex-direction:column;gap:10px}
.card-title{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.2;margin:0;text-wrap:balance}
.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.stops li{position:relative;padding-left:22px;font-size:15px;line-height:1.4}
.stops li::before{content:"";position:absolute;left:3px;top:.52em;width:8px;height:8px;border-radius:50%;border:2px solid var(--ink);background:var(--surface)}
.stops li:not(:last-child)::after{content:"";position:absolute;left:6.5px;top:calc(.52em + 10px);bottom:-9px;width:1px;background:var(--line)}
.extra{font-size:13px;color:var(--ink-2);margin:0}
.base{font-size:12px;color:var(--ink-3);margin:0}

.ask{font-weight:700;font-size:16px;margin:0;text-align:center}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rate{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 2px;font:inherit;font-size:11.5px;font-weight:700;line-height:1.2;cursor:pointer;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.rate .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.rate:active{transform:scale(.97)}
.scale-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:-8px}

.pairs{display:flex;flex-direction:column;gap:14px}
.pair{display:flex;flex-direction:column;gap:8px}
.pair-label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0}
.pair-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px;font:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.opt .k{font-family:var(--display);font-weight:700;font-size:26px;line-height:1}
.opt img{display:block;width:100%;height:70px;object-fit:cover;border-radius:8px}
.opt .t{font-weight:700;font-size:14px;line-height:1.3}
.opt .s{font-size:12px;color:var(--ink-2)}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}

.picklist{display:flex;flex-direction:column;gap:8px}
.pick{appearance:none;display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font:inherit;color:var(--ink);cursor:pointer}
.pick .k{font-family:var(--display);font-weight:700;font-size:28px;width:38px;text-align:center;flex:none}
.pick .t{display:block;font-weight:700;font-size:15px;line-height:1.3}
.pick .s{display:block;font-size:12px;color:var(--ink-3)}
.pick .tag{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.04em;flex:none;color:var(--urushi)}
.pick[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
label.fl{font-weight:700;font-size:14px;display:flex;flex-direction:column;gap:8px}
input[type="text"],textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.picked{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.picked .k{font-family:var(--display);font-weight:700;font-size:30px}
.picked .t{font-weight:700}

.result-kanji{font-family:var(--display);font-weight:800;font-size:96px;line-height:1;margin:0}
.dist{border-left:3px solid var(--ink);padding-left:12px;margin:0;font-size:15px}
.save{font-size:13px;color:var(--ink-3);margin:0}
details.org{border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
details.org summary{cursor:pointer;font-size:13px;color:var(--ink-2)}
details.org[open] summary{margin-bottom:10px}
.org-row{display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion: reduce){.card.fly,.progress i{transition:none}.card.enter{animation:none}}
.more{appearance:none;align-self:flex-start;border:0;background:none;color:var(--bay);font:inherit;font-size:14px;font-weight:700;padding:4px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.card-body{cursor:pointer}
body.lock{overflow:hidden}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(17,20,22,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet-panel{position:relative;background:var(--paper);width:100%;max-width:440px;max-height:94vh;overflow-y:auto;border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet-photo{position:relative;height:190px;background:var(--line)}
.sheet-photo img{display:block;width:100%;height:100%;object-fit:cover}
.sheet-photo .kchip{position:absolute;left:12px;top:12px;background:rgba(17,20,22,.72);color:#fff;border-radius:8px;padding:4px 8px;font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.sheet-close{position:absolute;right:10px;top:10px;appearance:none;border:0;border-radius:999px;background:rgba(17,20,22,.72);color:#fff;font:inherit;font-size:13px;font-weight:700;padding:7px 12px;cursor:pointer}
.sheet-body{padding:16px 18px 8px;display:flex;flex-direction:column;gap:14px}
.fly-title{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.2;margin:0;text-wrap:balance}
.fly-hook{font-size:15px;color:var(--ink-2);margin:0}
.fly-facts{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.fly-facts li{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--surface)}
.fly-h{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0;padding-bottom:4px;border-bottom:1px solid var(--line)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.tl li{display:grid;grid-template-columns:48px 1fr 40px;gap:10px;align-items:start}
.heart{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;width:38px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--ink-3);padding:0}
.heart svg{width:18px;height:18px;display:block}
.heart[aria-pressed="true"]{color:#fff;background:var(--urushi);border-color:var(--urushi)}
.fly-hint{font-size:13px;color:var(--ink-2);margin:-6px 0 0}
.tl time{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;color:var(--ink-2)}
.tl b{display:block;font-size:15px;line-height:1.35}
.tl span{display:block;font-size:13px;color:var(--ink-2);line-height:1.45}
.incl{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.fly-know{font-size:13px;color:var(--ink-2);margin:0}
.sheet-foot{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.sheet-foot .ask{font-size:14px}
.start-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.type-hero{display:flex;align-items:center;gap:16px}
.type-hero .result-kanji{font-size:84px}
.type-road{margin:6px 0 0;font-size:14px;color:var(--ink-2)}
.traits{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.traits li{position:relative;padding-left:24px;font-size:15px;line-height:1.45}
.traits li::before{content:"\2713";position:absolute;left:2px;top:0;color:var(--urushi);font-weight:700}
.rh{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.25;margin:10px 0 0;text-wrap:balance}
.matches{display:flex;flex-direction:column;gap:10px}
.match{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px}
.match img{width:72px;height:72px;object-fit:cover;border-radius:8px;display:block}
.match .mk{width:72px;height:72px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:34px;background:var(--paper);border-radius:8px}
.m-rank{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.m-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.m-top b{font-size:15px;line-height:1.3}
.m-pct{font-family:var(--display);font-weight:800;color:var(--urushi);font-size:20px;white-space:nowrap}
.m-pct small{font-family:var(--body);font-size:11px;font-weight:700;color:var(--ink-3);margin-left:3px}
.m-why{font-size:12.5px;color:var(--ink-2);margin-top:4px;line-height:1.45}
.cday{list-style:none;margin:0;display:flex;flex-direction:column;gap:12px;border-left:2px solid var(--line);padding:0 0 0 14px}
.cday li{display:flex;flex-direction:column;gap:1px}
.cday .when{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--urushi)}
.cday b{font-size:15px;line-height:1.35}
.cday .from{font-size:12px;color:var(--ink-3)}
.share-img{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);flex:none}
.lang button{appearance:none;border:0;background:none;color:var(--ink-2);font:inherit;font-size:12px;font-weight:700;padding:6px 12px;cursor:pointer;min-height:32px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
</style>
</head>
<body>
<div class="app">

  <section class="screen" id="s-start">
    <div class="start-top">
      <p class="eyebrow" data-t="eyebrow_start">Noto Peninsula, Japan</p>
      <div class="lang" role="group" aria-label="Language / 言語">
        <button type="button" data-lang="en" aria-pressed="true">English</button>
        <button type="button" data-lang="ja" aria-pressed="false" lang="ja">日本語</button>
      </div>
    </div>
    <h1 class="h-display" data-th="h_start">Which Noto day is yours?</h1>
    <div class="deck" aria-hidden="true"><span>静</span><span>禅</span><span>漆</span><span>匠</span><span>海</span><span>縁</span><span>鮨</span><span>酒</span></div>
    <p class="lead" data-t="lead_start"></p>
    <ul class="facts"><li data-t="f1"></li><li data-t="f2"></li><li data-t="f3"></li></ul>
    <p class="note" data-t="note_start"></p>
    <p class="note" id="mode-note" hidden></p>
    <div class="spacer"></div>
    <button class="btn primary" id="b-start" type="button" data-t="start">Start</button>
  </section>

  <section class="screen" id="s-about" hidden>
    <p class="eyebrow" data-t="eyebrow_about"></p>
    <h2 class="h2" data-t="h_about"></h2>
    <div class="q"><p class="q-label" data-t="q_region"></p><div class="chips" id="q-region"></div></div>
    <div class="q"><p class="q-label" data-t="q_company"></p><div class="chips" id="q-company"></div></div>
    <div class="q"><p class="q-label" data-t="q_spend"></p><div class="chips" id="q-spend"></div></div>
    <div class="spacer"></div>
    <button class="btn primary" id="b-about-next" type="button" disabled data-t="next"></button>
  </section>

  <section class="screen" id="s-cards" hidden>
    <div class="top"><div class="progress"><i id="bar"></i></div><span class="count" id="count"></span></div>
    <div class="stage" id="stage"></div>
    <p class="ask" id="ask" data-t="ask"></p>
    <div class="scale" id="scale">
      <button class="rate" type="button" data-r="1" style="--c:var(--slate)"><span class="dot"></span><span data-th="r1"></span></button>
      <button class="rate" type="button" data-r="2" style="--c:color-mix(in srgb,var(--slate) 55%,var(--line))"><span class="dot"></span><span data-th="r2"></span></button>
      <button class="rate" type="button" data-r="3" style="--c:var(--line)"><span class="dot"></span><span data-th="r3"></span></button>
      <button class="rate" type="button" data-r="4" style="--c:color-mix(in srgb,var(--urushi) 55%,var(--line))"><span class="dot"></span><span data-th="r4"></span></button>
      <button class="rate" type="button" data-r="5" style="--c:var(--urushi)"><span class="dot"></span><span data-th="r5"></span></button>
    </div>
    <button class="linkbtn" id="b-unsure" type="button" data-t="unsure"></button>
  </section>

  <section class="screen" id="s-pairs" hidden>
    <p class="eyebrow" data-t="eyebrow_pairs"></p>
    <h2 class="h2" data-t="h_pairs"></h2>
    <div class="pairs" id="pairs"></div>
    <div class="spacer"></div>
    <button class="btn primary" id="b-pairs-next" type="button" disabled data-t="next"></button>
  </section>

  <section class="screen" id="s-reason" hidden>
    <h2 class="h2" data-t="h_reason"></h2>
    <p class="sub" data-t="sub_reason"></p>
    <div class="chips" id="q-reason"></div>
    <div class="spacer"></div>
    <button class="btn primary" id="b-reason-next" type="button" data-t="next"></button>
  </section>

  <section class="screen" id="s-pick" hidden>
    <h2 class="h2" data-t="h_pick"></h2>
    <p class="sub" data-t="sub_pick"></p>
    <div class="picklist" id="picklist"></div>
    <label class="fl" for="why"><span data-t="why_label"></span>
      <input type="text" id="why" maxlength="200" autocomplete="off" data-tp="why_ph">
    </label>
    <div class="spacer"></div>
    <button class="btn primary" id="b-pick-next" type="button" disabled data-t="next"></button>
  </section>

  <section class="screen" id="s-price" hidden>
    <h2 class="h2" data-t="h_price"></h2>
    <div class="picked" id="price-card"></div>
    <p class="sub" data-t="sub_price"></p>
    <div class="chips" id="q-price"></div>
    <div class="spacer"></div>

  // ---------- result ----------
  function computeType(){
    var type = S.pick ? BY[S.pick].theme : "heal";
    var farCount = PAIRS.filter(function(p){ return S.pairs[p.theme] === "far"; }).length;
    return {type:type, road:farCount >= 2, farCount:farCount};
  }
  function toMin(hm){ var p = String(hm).split(":"); return Number(p[0]) * 60 + Number(p[1] || 0); }
  function whenKey(hm){ var m = toMin(hm); return m < 690 ? "when_morning" : (m < 840 ? "when_midday" : (m < 1050 ? "when_afternoon" : "when_evening")); }
  function spotTitle(c, sp){ var i = (SPOTS[c] || []).indexOf(sp), f = FLY[c]; return i < 0 ? "" : (f[LANG] || f.en).steps[i][1]; }
  function heartsOf(id){ return Object.keys(S.hearts).filter(function(k){ return k.indexOf(id + ":") === 0; }).map(function(k){ return S.hearts[k]; }); }
  // Match score (for fun, from the person's own answers): rating 1..5 -> 30..90, "not sure" 35; +4 per heart (up to 2); +5 for the one pick; +2 when the distance fits.
  function computeMatches(road){
    var pref = road ? "far" : "near";
    var list = S.ratings.map(function(s){
      var hs = heartsOf(s.id), base = s.r === 0 ? 35 : 30 + (s.r - 1) * 15;
      var score = base + Math.min(hs.length, 2) * 4 + (S.pick === s.id ? 5 : 0) + (BY[s.id].dist === pref ? 2 : 0);
      return {id:s.id, r:s.r, hearts:hs, score:Math.min(99, score)};
    });
    list.sort(function(a, b){ return b.score - a.score || b.r - a.r || b.hearts.length - a.hearts.length; });
    return list.slice(0, 3);
  }
  function whyFor(m, road){
    var out = [];
    if (S.pick === m.id) out.push(t("why_pick"));
    if (m.hearts.length) out.push(t("why_hearts").replace("{s}", m.hearts.slice(0, 2).map(function(h){ return spotTitle(h.c, h.s); }).join(", ")));
    if (m.r > 0) out.push(t("why_rating").replace("{r}", RL[LANG][m.r] || RL.en[m.r]));
    var d = BY[m.id].dist;
    if (d === "far" && road) out.push(t("why_far"));
    if (d === "near" && !road) out.push(t("why_near"));
    return out.slice(0, 2);
  }
  // A custom day from the hearted spots (same spot counted once), topped up from the best match, ordered morning to evening.
  function customDay(topId){
    var items = [], seen = {};
    Object.keys(S.hearts).forEach(function(k){
      var h = S.hearts[k], i = (SPOTS[h.c] || []).indexOf(h.s);
      if (i < 0 || seen[h.s]) return; seen[h.s] = 1;
      var st = (FLY[h.c][LANG] || FLY[h.c].en).steps[i];
      items.push({time:st[0], title:st[1], c:h.c});
    });
    var fromHearts = items.length > 0;
    if (items.length < 3 && topId) {
      (SPOTS[topId] || []).forEach(function(sp, i){
        if (!sp || seen[sp] || items.length >= 4) return; seen[sp] = 1;
        var st = (FLY[topId][LANG] || FLY[topId].en).steps[i];
        items.push({time:st[0], title:st[1], c:topId});
      });
    }
    items.sort(function(a, b){ return toMin(a.time) - toMin(b.time); });
    return {items:items.slice(0, 6), fromHearts:fromHearts};
  }

  // ---------- share card ----------
  function shareUrl(){ return location.origin + location.pathname + (LANG === "ja" ? "?lang=ja" : "") + "#share"; }
  function wrapText(g, text, x, y, maxW, lh, maxLines){
    var tokens = /\s/.test(text) ? text.split(/(\s+)/) : Array.from(text), line = "", lines = [];
    tokens.forEach(function(tok){ var test = line + tok; if (g.measureText(test).width > maxW && line.trim()) { lines.push(line.trim()); line = tok.trim() ? tok : ""; } else line = test; });
    if (line.trim()) lines.push(line.trim());
    lines.slice(0, maxLines || 9).forEach(function(l, i){ g.fillText(l, x, y + i * lh); });
    return Math.min(lines.length, maxLines || 9);
  }
